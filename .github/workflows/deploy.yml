name: Deploy New Tab Page

on:
  push:
    branches: [ "main" ] # Change to "master" if your default branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Required permissions to publish to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-running: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Unsplash API Key
        run: |
          sed -i 's/YOUR_UNSPLASH_API_KEY_PLACEHOLDER/${{ secrets.YOUR_UNSPLASH_API_KEY }}/g' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
