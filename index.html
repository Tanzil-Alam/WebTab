<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--This is deafault for sizing-->
    <title>New Tab</title> <!--I titled it New Tab because its like a tab of google-->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Sized the total box contant */
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
        }

        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #08090d;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            z-index: -2;
            transition: background-image 0.4s ease-in-out;
            /*For extra bgs i added*/
        }

        #stars {
            position: fixed;
            /*it was giving error of stars, so i added this to fix the stars*/

        }

        .container {
            width: 90%;
            max-width: 660px;
            transform: translateY(-10px);
        }

        .clock {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 14px 42px;
            text-align: center;
            /* aligned the time in center*/
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            /*added a shadow color*/
            transition: 0.25s ease;
            transform: translatelY(-10px);
        }

        .clock:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-10px);
            /*made that it will go 10px up if my pointer go on it*/
        }

        #time {
            /* fixed size and gap for time */
            font-size: 46px;
            font-weight: 300;
            letter-spacing: 2px;
            color: rgba(255, 255, 190, 0.8)
                /*made like golden, or white+gold mix color*/
        }

        #date {
            /* also fixed date characters size */
            font-size: 14px;
            color: rgba(255, 255, 200, 0.8);
            /*Date gives golden vibe*/
            margin-top: 4px;

        }

        .search-box {
            /* made my search box transparent glassy look */
            width: 100%;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 36px;
            padding: 8px 10px 8px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
            transition: 0.25s ease;
        }

        .search-box:focus-within {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
        }

        .search-box input {
            /* it will input my text */
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #fff;
            font-size: 18px;
            padding: 6px 0;
        }

        .search-box input::placeholder {
            /* writed place holder color */
            color: rgba(255, 255, 255, 0.6);
        }

        .search-box button {
            /* also added a search icon and animation of it. also it shows my mouse a pointer*/
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-box button:hover {
            /*my search icon now can fly if my mouse go on it*/
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .search-box svg {
            /* used a svg icon */
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        .shortcuts {
            /*default shortcut's size and gap*/
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .shortcuts a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-size: 13px;
            transition: transform 0.2s;
            width: 78px;
        }

        .shortcuts a:hover {
            /* shortcut goes -4px upper if i point my mouse*/
            transform: translateY(-4px);
        }

        .icon {
            /* fixed icon's size and color*/
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.075);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transition: 0.25s ease;
        }

        .shortcuts a:hover .icon {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .icon img {
            width: 34px;
            height: 34px;
            border-radius: 8px;
        }

        .settings button {
            /*Fixed the hover size*/
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .settings:hover button {
            /*The hover transition starts here*/
            transform: scale(1.1);
            opacity: 0.8;
        }
    </style>
</head>

<body>


    <div id="bg"></div> <!--For default image-->
    <canvas id="stars"></canvas>

    <div class="container">
        <div class="clock">
            <div id="time"></div>
            <div id="date"></div>
        </div>
        <br>
        <br>
        <form action="https://www.google.com/search" method="GET" class="search-box"> <!--The searchbox-->
            <input type="text" name="q" placeholder="Search Google..." autocomplete="off">
            <button type="submit">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                </svg>
            </button>
        </form>
        <br>
        <br> <!--used for getting a little gap-->
        <div class="shortcuts"> <!--Used default shortcuts-->
            <a href="https://www.youtube.com" target="_blank">
                <div class="icon"></div>
                <span>YouTube</span>
            </a>
            <a href="https://github.com" target="_blank">
                <div class="icon"></div>
                <span>GitHub</span>
            </a>
            <a href="https://mail.google.com" target="_blank">
                <div class="icon"></div>
                <span>Gmail</span>
            </a>
            <a href="https://reddit.com" target="_blank">
                <div class="icon"></div>
                <span>Reddit</span>
            </a>
            <a href="https://chatgpt.com" target="_blank">
                <div class="icon"></div>
                <span>ChatGPT</span>
            </a>
        </div>
    </div>
    <div class="settings"> <!--The new settings button that i added-->
        <div style="width: 5px;">
            <button type="button" id="bg-toggle-btn" aria-label="Settings"
                style="position: absolute; top: 12px; right: 12px; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                <img src="Settings.png" alt="Settings" style="width: 24px; height: 24px; object-fit: contain;" />
            </button>
        </div>
    </div>
    <br> <!--used for gap-->

    <script> /* started writing JS */
        document.querySelectorAll('.shortcuts a').forEach(a => {
            const domain = new URL(a.href).hostname;
            a.querySelector('.icon').innerHTML = `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64">`;
        });

        function updateClock() { /* my clock will update in every second */
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time').textContent = `${h}:${m}:${s}`;
            document.getElementById('date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        }
        updateClock();
        setInterval(updateClock, 1000); /* 1000 = 1 sec*/

        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        const stars = [];
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * window.innerWidth, /* for my stars or moving particles*/
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.6 + 0.2,
                opacity: Math.random() * 0.7 + 0.3
            });
        }

        function animate() { /*The animations*/
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width; /*Random movement for looking so realistic like spaceeeeeeee*/
                }
                ctx.fillStyle = `rgba(255, 255, 200, ${s.opacity})`; /*Golden type of color*/
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();

        const clientId = Your_Unplash_Api_Key; /*Add your api key pleasee*/
        const bgElement = document.getElementById('bg'); // Target #bg
        const button = document.getElementById('bg-toggle-btn');

        function fetchUnsplashBackground() {
            const unsplashUrl = `https://api.unsplash.com/photos/random?client_id=${clientId}&orientation=landscape`;

            fetch(unsplashUrl)
                .then(response => response.json())
                .then(data => {
                    if (data && data.urls && data.urls.regular) {
                        bgElement.style.backgroundImage = `url('${data.urls.regular}')`;
                    }
                })
                .catch(error => {
                    console.error('Error fetching Unsplash image:', error);
                    bgElement.style.backgroundImage = `url('bg1.jfif')`;
                });
        }

        // Fetch new background on every page load
        fetchUnsplashBackground();

        // Also fetch a new background when the settings button is clicked
        button.addEventListener('click', () => {
            fetchUnsplashBackground();
        });
    </script>
    <br>.
</body>

</html>
